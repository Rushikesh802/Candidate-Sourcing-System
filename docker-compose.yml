version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: candidate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: candidate_sourcing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candidate_sourcing"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: candidate_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/candidate_sourcing
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_for_testing_and_local_development_123456789}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      UPLOAD_DIR: ${UPLOAD_DIR:-./data/uploads}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-noreply@talentbridge.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@talentbridge.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - uploads_data:/app/data/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: candidate_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  mailhog:
    image: mailhog/mailhog:latest
    container_name: candidate_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

volumes:
  pgdata:
  uploads_data:
