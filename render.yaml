services:
  # FastAPI Backend API
  - type: web
    name: candidate-sourcing-api
    runtime: python
    rootDir: apps/api
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: candidate-sourcing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: "60"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: UPLOAD_DIR
        value: "./data/uploads"
      - key: ADMIN_EMAIL
        value: "admin@talentbridge.local"
      - key: ADMIN_PASSWORD
        value: "Admin@12345"
      - key: ALLOWED_ORIGINS
        value: "*"

  # Next.js Frontend
  - type: web
    name: candidate-sourcing-web
    runtime: node
    rootDir: apps/web
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: candidate-sourcing-api
          property: host

databases:
  - name: candidate-sourcing-db
    plan: free
    databaseName: candidate_sourcing
    user: candidate_user
